{% extends "public_base.html" %}
{% block title %}{{ title }} — ITSB FIND{% endblock %}
{% block content %}
<section class="section" style="min-height:80vh;display:grid;place-items:center;text-align:center">
  <div class="container"><h1 style="font-size:clamp(4rem,12vw,8rem);background:linear-gradient(120deg,#fff,var(--red-2));-webkit-background-clip:text;background-clip:text;color:transparent">{{ code }}</h1>
  <h2 style="margin:.5rem 0">{{ title }}</h2><p style="max-width:460px;margin:0 auto 1.6rem">{{ text }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.landing') }}"><i data-lucide="home" class="i"></i>Kembali ke beranda</a></div>
</section>
{% endblock %}
